spring:
  application:
    name: kobe-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kobe}
    username: ${SPRING_DATASOURCE_USERNAME:kobe}
    password: ${SPRING_DATASOURCE_PASSWORD:kobe}
  flyway:
    # スキーマは Flyway が管理 (db/migration の V__*.sql を起動時に適用)
    enabled: true
    # 既定は false。接続先取り違え時に非空 DB を勝手に baseline しない。
    # Supabase では profile=supabase または SPRING_FLYWAY_BASELINE_ON_MIGRATE=true で有効化。
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    # 既定 baseline-version=1 だと V1 がスキップされるため 0 にする
    baseline-version: 0
  jpa:
    hibernate:
      # スキーマは Flyway が所有。Hibernate は検証のみ行う
      ddl-auto: ${SPRING_JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
  servlet:
    multipart:
      # 画像アップロードの上限（UploadMediaService の検証と整合）
      max-file-size: ${MEDIA_MAX_FILE_SIZE:5MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:6MB}

server:
  # Metro/Expo (8081 系) との衝突回避のためデフォルトを 9090 にずらしている
  port: ${SERVER_PORT:9090}
  # 本番は Caddy が TLS 終端する（deploy/ec2/Caddyfile）。X-Forwarded-Proto/Host を
  # 解釈しないと OpenAPI の servers が http://app:9090 になり、Swagger UI の
  # Try it out が届かない。native（Tomcat RemoteIpValve）は内部 IP（Docker の
  # 172.16/12 等）からのヘッダーだけを信頼するため、:9090 直叩きでの偽装は効かない。
  forward-headers-strategy: native

# API 契約（#82）。Swagger UI: /swagger-ui.html、OpenAPI JSON: /v3/api-docs
# 閲覧のみで、書き込み系の認可は SecurityConfig のまま。止めたい環境では
# SPRINGDOC_ENABLED=false にする。
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    # 認証済みで試すとき、ページを再読込しても Bearer を入れ直さずに済むようにする
    persist-authorization: true

# Supabase Auth JWT（#89）。検証は JWKS（Signing Keys / ES256 等）。url 空時のみ JWT Secret(HS256)。
# Auth プロキシ（#89-b）は url / anon-key を使う。詳細: docs/supabase-jwt.md / docs/supabase-auth-proxy.md
supabase:
  url: ${SUPABASE_URL:}
  anon-key: ${SUPABASE_ANON_KEY:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  jwt:
    secret: ${SUPABASE_JWT_SECRET:}

# 画像アップロード（S3 代理保存 / #86）。認証情報は SDK 既定の認証チェーン（IAM ロール / env）。
# bucket / region 未設定時は起動は妨げず、初回アップロードで例外にする。
# public-base-url を設定すると返却 URL のベースにする（CloudFront 等）。空なら S3 仮想ホスト URL。
media:
  s3:
    bucket: ${MEDIA_S3_BUCKET:}
    region: ${MEDIA_S3_REGION:}
    public-base-url: ${MEDIA_S3_PUBLIC_BASE_URL:}
  icon:
    # ユーザーアイコン 1 枚の上限（#184）。一般利用者に開く経路なので multipart 全体の
    # 上限（MEDIA_MAX_FILE_SIZE）より小さく絞る。サーバー側で長辺 512px へ縮小するため、
    # これ以上の解像度を受け取っても保存される画像は変わらない。
    max-file-size: ${MEDIA_ICON_MAX_FILE_SIZE:2MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
