spring:
  application:
    name: kobe-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kobe}
    username: ${SPRING_DATASOURCE_USERNAME:kobe}
    password: ${SPRING_DATASOURCE_PASSWORD:kobe}
  jpa:
    hibernate:
      # 開発中は update。スキーマ管理を導入したら none に切り替える
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: ${SPRING_JPA_SHOW_SQL:false}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
