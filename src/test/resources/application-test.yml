spring:
  flyway:
    # テストは H2 + Hibernate(create-drop)。Flyway は無効化
    enabled: false
  datasource:
    url: jdbc:h2:mem:kobe;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

# Resource Server / Auth プロキシ起動用（本番値ではない）。
# url を空にして HS256 + jwt.secret で検証（本物の JWKS に依存しない）。
supabase:
  url: ""
  anon-key: test-anon-key
  jwt:
    secret: test-supabase-jwt-secret-for-hs256-only
