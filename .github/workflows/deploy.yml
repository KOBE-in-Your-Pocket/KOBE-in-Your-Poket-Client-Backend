name: deploy

# 本番想定 CD: GitHub Actions → ECR → SSM Run Command → EC2
# SSH (22) をインターネットに開けない。OIDC で AWS に一時認証する。

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: kobe-backend
  EC2_INSTANCE_ID: i-0d0c06a6ced085c4d
  EC2_HOST: 18.181.34.28
  APP_PORT: "9090"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::515966496540:role/kobe-backend-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure EC2 + SSM are ready
        run: |
          # stopping/pending 中に start すると IncorrectInstanceState になるため、
          # start 可能な状態になるまで待ってから起動する。
          for i in $(seq 1 60); do
            STATE=$(aws ec2 describe-instances \
              --instance-ids "${EC2_INSTANCE_ID}" \
              --query 'Reservations[0].Instances[0].State.Name' --output text)
            echo "EC2 state=${STATE}"
            case "${STATE}" in
              running)
                break
                ;;
              stopped)
                echo "EC2 is stopped. Starting..."
                if aws ec2 start-instances --instance-ids "${EC2_INSTANCE_ID}"; then
                  aws ec2 wait instance-running --instance-ids "${EC2_INSTANCE_ID}"
                  break
                fi
                echo "Start failed (likely transitional). Retrying..."
                sleep 10
                ;;
              stopping|shutting-down|pending)
                echo "Waiting for transitional state (${STATE}) to finish..."
                sleep 10
                ;;
              *)
                echo "Unexpected EC2 state: ${STATE}" >&2
                exit 1
                ;;
            esac
            if [[ "${i}" -eq 60 ]]; then
              echo "Timed out waiting for EC2 to become startable/running" >&2
              exit 1
            fi
          done
          for i in $(seq 1 36); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${EC2_INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' --output text)
            echo "SSM status=${STATUS}"
            if [[ "${STATUS}" == "Online" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "SSM agent is not Online" >&2
          exit 1

      - name: Set up QEMU (arm64 build on Actions)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          PLATFORM="${DOCKER_PLATFORM:-linux/arm64}"
          docker buildx build \
            --platform "${PLATFORM}" \
            --push \
            -t "${IMAGE_URI}" \
            -t "${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:latest" \
            .
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "Pushed ${IMAGE_URI}"

      - name: Deploy via SSM (no public SSH)
        run: |
          IMAGE_URI="${IMAGE_URI}"
          PARAMS=$(mktemp)
          cat > "${PARAMS}" <<EOF
          {
            "commands": [
              "set -euo pipefail",
              "cd /opt/kobe-backend",
              "APP_IMAGE='${IMAGE_URI}' USE_SECRETS_MANAGER=false AWS_REGION=${AWS_REGION} bash /opt/kobe-backend/deploy.sh"
            ]
          }
          EOF
          # compact JSON (strip leading spaces from pretty heredoc)
          python3 -c "import json,sys; p=sys.argv[1]; json.dump(json.load(open(p)), open(p,'w'))" "${PARAMS}"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${IMAGE_URI}" \
            --parameters "file://${PARAMS}" \
            --query 'Command.CommandId' --output text)
          echo "COMMAND_ID=${COMMAND_ID}"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            echo "try ${i}: ${STATUS}"
            case "${STATUS}" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
                exit 1
                ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          FINAL=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query 'Status' --output text)
          [[ "${FINAL}" == "Success" ]]

      - name: Health check
        run: |
          for i in $(seq 1 36); do
            if curl -fsS "http://${EC2_HOST}:${APP_PORT}/actuator/health"; then
              echo ""
              echo "health OK"
              exit 0
            fi
            sleep 5
          done
          echo "health check failed" >&2
          exit 1
