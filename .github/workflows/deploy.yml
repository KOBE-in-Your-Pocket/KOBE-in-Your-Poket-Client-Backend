name: deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 既存 CI を再利用したい場合は needs で lint/test を待つ運用に変更可
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 build on Actions)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          PLATFORM="${DOCKER_PLATFORM:-linux/arm64}"
          docker build --platform "${PLATFORM}" \
            -t "kobe-backend:${IMAGE_TAG}" -t kobe-backend:latest .
          docker save "kobe-backend:${IMAGE_TAG}" -o /tmp/kobe-backend.tar
          ls -lh /tmp/kobe-backend.tar

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem

      - name: Copy image to EC2
        env:
          HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_SSH_USER }}
        run: |
          SSH_USER="${SSH_USER:-ec2-user}"
          scp -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=accept-new \
            /tmp/kobe-backend.tar \
            "${SSH_USER}@${HOST}:/opt/kobe-backend/image.tar"

      - name: Remote deploy (load + secrets inject + restart)
        env:
          HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_SSH_USER }}
          SECRET_NAME: ${{ secrets.SECRET_NAME }}
          AWS_REGION_INPUT: ${{ secrets.AWS_REGION }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SSH_USER="${SSH_USER:-ec2-user}"
          SECRET_NAME="${SECRET_NAME:-kobe/backend/prod}"
          AWS_REGION="${AWS_REGION_INPUT:-ap-northeast-1}"
          ssh -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${HOST}" \
            "APP_IMAGE='kobe-backend:${IMAGE_TAG}' SECRET_NAME='${SECRET_NAME}' AWS_REGION='${AWS_REGION}' USE_SECRETS_MANAGER='${USE_SECRETS_MANAGER:-false}' \
             bash /opt/kobe-backend/deploy.sh /opt/kobe-backend/image.tar"

      - name: Health check
        env:
          HOST: ${{ secrets.EC2_HOST }}
          APP_PORT_INPUT: ${{ secrets.APP_PORT }}
        run: |
          APP_PORT="${APP_PORT_INPUT:-9090}"
          for i in $(seq 1 30); do
            if curl -fsS "http://${HOST}:${APP_PORT}/actuator/health"; then
              echo ""
              echo "health OK"
              exit 0
            fi
            sleep 5
          done
          echo "health check failed" >&2
          exit 1
