name: deploy

# 本番想定 CD: GitHub Actions → ECR → SSM Run Command → EC2 (t3.small / amd64)
# SSH (22) をインターネットに開けない。OIDC で AWS に一時認証する。
# EC2 が x86 のため ubuntu-latest でネイティブビルド（QEMU / arm ランナー不要）。

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: kobe-backend
  EC2_INSTANCE_ID: i-033fbb6ce4e9f49ae
  EC2_HOST: 18.181.34.28
  APP_PORT: "9090"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::515966496540:role/kobe-backend-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure EC2 + SSM are ready
        run: |
          # stopping/pending 中に start すると IncorrectInstanceState になるため、
          # start 可能な状態になるまで待ってから起動する。
          for i in $(seq 1 60); do
            STATE=$(aws ec2 describe-instances \
              --instance-ids "${EC2_INSTANCE_ID}" \
              --query 'Reservations[0].Instances[0].State.Name' --output text)
            echo "EC2 state=${STATE}"
            case "${STATE}" in
              running)
                break
                ;;
              stopped)
                echo "EC2 is stopped. Starting..."
                if aws ec2 start-instances --instance-ids "${EC2_INSTANCE_ID}"; then
                  # この run が起動したという印。後段の Stop EC2 ステップが見る。
                  # 人が手動で起動して作業している最中に CD が走っても落とさないよう、
                  # 「自分が起動したものだけ片付ける」形にしている。
                  echo "STARTED_BY_CD=true" >> "${GITHUB_ENV}"
                  aws ec2 wait instance-running --instance-ids "${EC2_INSTANCE_ID}"
                  break
                fi
                echo "Start failed (likely transitional). Retrying..."
                sleep 10
                ;;
              stopping|shutting-down|pending)
                echo "Waiting for transitional state (${STATE}) to finish..."
                sleep 10
                ;;
              *)
                echo "Unexpected EC2 state: ${STATE}" >&2
                exit 1
                ;;
            esac
            if [[ "${i}" -eq 60 ]]; then
              echo "Timed out waiting for EC2 to become startable/running" >&2
              exit 1
            fi
          done
          for i in $(seq 1 36); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${EC2_INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' --output text)
            echo "SSM status=${STATUS}"
            if [[ "${STATUS}" == "Online" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "SSM agent is not Online" >&2
          exit 1

      # EC2 上の設定ファイルをリポジトリの内容で上書きする。
      #
      # compose.yaml / Caddyfile / deploy.sh は EC2 の /opt/kobe-backend に置かれた
      # ものが使われる。同期しないと、リポジトリで変更しても EC2 に反映されない
      # （Caddyfile を書き換えても TLS 設定が変わらない、など）。
      #
      # 内容は base64 で渡す。JSON とヒアドキュメントの二重エスケープを避けるため。
      # app.env は秘密情報を含むため対象外（Secrets Manager か手動配置のまま）。
      - name: Sync EC2 config from repo
        run: |
          REMOTE_DIR=/opt/kobe-backend
          PARAMS=$(mktemp)
          python3 - "${PARAMS}" <<'PY'
          import base64, json, sys

          files = ["compose.yaml", "Caddyfile", "deploy.sh"]
          commands = ["set -euo pipefail", "sudo mkdir -p /opt/kobe-backend"]
          for name in files:
              with open(f"deploy/ec2/{name}", "rb") as f:
                  encoded = base64.b64encode(f.read()).decode()
              commands.append(f"echo {encoded} | base64 -d > /opt/kobe-backend/{name}")
          commands.append("chmod +x /opt/kobe-backend/deploy.sh")
          commands.append("ls -l /opt/kobe-backend/compose.yaml /opt/kobe-backend/Caddyfile")

          with open(sys.argv[1], "w", encoding="utf-8") as f:
              json.dump({"commands": commands}, f)
          PY
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "sync config ${GITHUB_SHA}" \
            --parameters "file://${PARAMS}" \
            --query 'Command.CommandId' --output text)
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            case "${STATUS}" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
                exit 1
                ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query '[Status,StandardOutputContent]' --output text

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          PLATFORM="${DOCKER_PLATFORM:-linux/amd64}"
          docker buildx build \
            --platform "${PLATFORM}" \
            --push \
            -t "${IMAGE_URI}" \
            -t "${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:latest" \
            .
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "Pushed ${IMAGE_URI}"

      - name: Deploy via SSM (no public SSH)
        run: |
          IMAGE_URI="${IMAGE_URI}"
          PARAMS=$(mktemp)
          cat > "${PARAMS}" <<EOF
          {
            "commands": [
              "set -euo pipefail",
              "cd /opt/kobe-backend",
              "APP_IMAGE='${IMAGE_URI}' USE_SECRETS_MANAGER=false AWS_REGION=${AWS_REGION} bash /opt/kobe-backend/deploy.sh"
            ]
          }
          EOF
          # compact JSON (strip leading spaces from pretty heredoc)
          python3 -c "import json,sys; p=sys.argv[1]; json.dump(json.load(open(p)), open(p,'w'))" "${PARAMS}"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${GITHUB_SHA}" \
            --parameters "file://${PARAMS}" \
            --query 'Command.CommandId' --output text)
          echo "COMMAND_ID=${COMMAND_ID}"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            echo "try ${i}: ${STATUS}"
            case "${STATUS}" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
                exit 1
                ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          FINAL=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query 'Status' --output text)
          [[ "${FINAL}" == "Success" ]]

      - name: Health check
        run: |
          for i in $(seq 1 36); do
            if curl -fsS "http://${EC2_HOST}:${APP_PORT}/actuator/health"; then
              echo ""
              echo "health OK"
              exit 0
            fi
            sleep 5
          done
          echo "health check failed" >&2
          exit 1

      # 開発環境の EC2 は EventBridge Scheduler で平日 9:00 起動 / 18:00 停止。
      # 時間外の push で CD が起動すると、次の停止（平日 18:00）まで動き続ける。
      # 金曜夜の push なら月曜 18:00 まで ≒ 3 日ぶん課金されるため、CD が起動した
      # 分は CD が片付ける。
      #
      # 停止するのは STARTED_BY_CD=true のときだけ。人が手動で起動して作業して
      # いる場合は EC2 が running で、この印が立たないので落とさない。
      # デプロイが失敗しても止めたいので always()（失敗時ほど消し忘れる）。
      - name: Stop EC2 if this run started it
        if: always() && env.STARTED_BY_CD == 'true'
        run: |
          HOUR=$(TZ=Asia/Tokyo date +%-H)
          DOW=$(TZ=Asia/Tokyo date +%u)   # 1=月 … 7=日
          if [[ "${DOW}" -le 5 && "${HOUR}" -ge 9 && "${HOUR}" -lt 18 ]]; then
            echo "稼働時間帯（平日 9:00-18:00 JST）のため停止しない。18:00 のスケジュールに任せる。"
            exit 0
          fi
          echo "稼働時間外のため停止する（JST $(TZ=Asia/Tokyo date '+%F %H:%M')）"
          aws ec2 stop-instances --instance-ids "${EC2_INSTANCE_ID}"
