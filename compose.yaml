services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kobe}
      POSTGRES_USER: ${POSTGRES_USER:-kobe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kobe}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kobe} -d ${POSTGRES_DB:-kobe}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 本番相当: マルチステージ Dockerfile でビルドした jar を実行 (make up)
  app:
    build:
      context: .
    profiles: [prod]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-kobe}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-kobe}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-kobe}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
    ports:
      - "9090:9090"

  # 開発: ソースから bootRun で起動 (make dev)。実 DB(Postgres) に接続するため
  # SPRING_DATASOURCE_* を注入する。
  dev:
    image: eclipse-temurin:17-jdk
    working_dir: /workspace
    command: ["./gradlew", "bootRun", "--no-daemon"]
    profiles: [dev]
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOME: /workspace
      GRADLE_USER_HOME: /workspace/.gradle
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-kobe}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-kobe}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-kobe}
      # Auth（#89）。ホストの .env から compose が展開してコンテナへ渡す
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
    volumes:
      - .:/workspace
    ports:
      - "9090:9090"

  # test / lint / build 用 (Makefile の GRADLE)。DB 不要 (テストは H2)。
  # dev と分離し SPRING_DATASOURCE_* を持たせない: 注入すると env 優先で
  # application-test.yml の H2 設定を上書きし、H2 ドライバに Postgres URL が
  # 渡って起動失敗するため。
  tools:
    image: eclipse-temurin:17-jdk
    working_dir: /workspace
    profiles: [tools]
    environment:
      HOME: /workspace
      GRADLE_USER_HOME: /workspace/.gradle
    volumes:
      - .:/workspace

volumes:
  db-data:
